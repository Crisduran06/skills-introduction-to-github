<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Bid Intel{% endblock %} — Bay Area Construction Bids</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --orange: #f97316;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --score5: #22c55e;
      --score4: #84cc16;
      --score3: #eab308;
      --score2: #f97316;
      --score1: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 8px; height: 52px; }
    nav .logo { font-weight: 700; font-size: 18px; color: var(--text); letter-spacing: -0.5px; margin-right: 24px; }
    nav .logo span { color: var(--accent); }
    nav a.nav-link { color: var(--muted); padding: 6px 12px; border-radius: 6px; transition: all .15s; font-size: 13px; }
    nav a.nav-link:hover, nav a.nav-link.active { color: var(--text); background: var(--surface2); text-decoration: none; }

    main { max-width: 1400px; margin: 0 auto; padding: 24px 20px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
    h3 { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
    .card + .card { margin-top: 16px; }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; }
    .stat-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }
    .stat-card-link { text-decoration: none; color: inherit; cursor: pointer; transition: border-color .15s, transform .1s; }
    .stat-card-link:hover { border-color: var(--accent); transform: translateY(-1px); text-decoration: none; }
    .stat-card-active { border-color: var(--accent) !important; background: rgba(59,130,246,.08); }
    .stat-card .value.green { color: var(--green); }
    .stat-card .value.yellow { color: var(--yellow); }
    .stat-card .value.accent { color: var(--accent); }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
    button, .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s; }
    button:hover, .btn:hover { background: var(--accent-hover); }
    button.secondary, .btn.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: var(--border); }
    button.success { background: var(--green); }
    button.warning { background: var(--orange); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }
    .table-wrap { overflow-x: auto; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .badge-open { background: rgba(34,197,94,.15); color: var(--green); }
    .badge-archived { background: rgba(148,163,184,.12); color: var(--muted); }
    .badge-awarded { background: rgba(59,130,246,.15); color: var(--accent); }
    .badge-bid_opened { background: rgba(234,179,8,.15); color: var(--yellow); }
    .badge-canceled { background: rgba(239,68,68,.12); color: var(--red); }
    .badge-addenda { background: rgba(249,115,22,.15); color: var(--orange); }
    .badge-unknown { background: rgba(148,163,184,.1); color: var(--muted); }

    .score { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-size: 12px; font-weight: 700; }
    .score-5 { background: rgba(34,197,94,.2); color: var(--score5); }
    .score-4 { background: rgba(132,204,22,.2); color: var(--score4); }
    .score-3 { background: rgba(234,179,8,.2); color: var(--score3); }
    .score-2 { background: rgba(249,115,22,.2); color: var(--score2); }
    .score-1 { background: rgba(239,68,68,.2); color: var(--score1); }
    .score-none { background: rgba(148,163,184,.1); color: var(--muted); }

    .delta-pos { color: var(--red); }
    .delta-neg { color: var(--green); }
    .delta-zero { color: var(--muted); }

    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,.4); display: none; z-index: 999; max-width: 360px; }
    .toast.show { display: block; animation: slideIn .2s ease; }
    @keyframes slideIn { from { transform: translateY(10px); opacity:0 } to { transform: translateY(0); opacity:1 } }

    .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty .icon { font-size: 40px; margin-bottom: 12px; }

    .tag { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); margin: 1px; }

    textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 7px; font-family: monospace; font-size: 13px; resize: vertical; }
    textarea:focus { outline: none; border-color: var(--accent); }
    select, input[type="text"] { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 7px; font-size: 13px; }
    select:focus, input:focus { outline: none; border-color: var(--accent); }

    .page-header { margin-bottom: 20px; }
    .page-header p { color: var(--muted); margin-top: 4px; }

    .section { margin-bottom: 24px; }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot-live { background: var(--green); }
    .dot-fixture_only { background: var(--yellow); }
    .dot-stub { background: var(--muted); }
    .dot-manual_only { background: var(--orange); }
    .dot-disabled { background: var(--red); }

    .check { color: var(--green); }
    .cross { color: var(--muted); }

    @media (max-width: 768px) {
      nav { padding: 0 12px; gap: 4px; }
      main { padding: 16px 12px; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<nav>
  <div class="logo">Bid<span>Intel</span></div>
  <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
  <a href="/analytics" class="nav-link {% if request.url.path == '/analytics' %}active{% endif %}">Analytics</a>
  <a href="/sources" class="nav-link {% if request.url.path == '/sources' %}active{% endif %}">Sources</a>
  <a href="/manual-import" class="nav-link {% if request.url.path == '/manual-import' %}active{% endif %}">Import</a>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
<div class="toast" id="toast"></div>
<script>
function showToast(msg, duration=4000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

async function apiPost(url, body={}) {
  try {
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    return await r.json();
  } catch(e) {
    return {error: e.message};
  }
}

async function loadFixtures() {
  showToast('Loading fixture data…');
  const r = await apiPost('/api/seed-fixtures');
  if(r.error) { showToast('Error: ' + r.error); return; }
  const c = r.current || {};
  const a = r.archives || {};
  showToast(`Loaded: ${(c.projects_added||0)+(a.projects_added||0)} projects, ${a.results_added||0} bid results. Analytics: ${r.analytics_calculated||0}. Refreshing…`);
  setTimeout(() => location.reload(), 1800);
}

async function fetchLive() {
  showToast('Fetching live sources… (may take a moment)');
  const r = await apiPost('/api/fetch-all');
  showToast('Live fetch complete. ' + JSON.stringify(r.results||r));
  setTimeout(() => location.reload(), 2000);
}

async function fetchHistory() {
  showToast('Loading historical / awarded bid data… (this may take 30–60 seconds)');
  const r = await apiPost('/api/fetch-archives');
  const added = (r.results||[]).reduce((s,x)=>s+(x.projects_added||0),0);
  showToast(`Historical data loaded: ${added} archived project(s) added. Refreshing…`);
  setTimeout(() => location.reload(), 2500);
}

async function calcAnalytics() {
  showToast('Calculating analytics…');
  const r = await apiPost('/api/calculate-analytics');
  showToast(`Analytics calculated for ${r.projects_calculated||0} project(s).`);
  setTimeout(() => location.reload(), 1500);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
